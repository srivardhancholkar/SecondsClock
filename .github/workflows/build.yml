name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install ldid
        run: brew install ldid
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$GITHUB_WORKSPACE/sdks-tmp"
          cp -a "$GITHUB_WORKSPACE"/sdks-tmp/iPhoneOS*.sdk "$GITHUB_WORKSPACE/theos/sdks/"
          rm -rf "$GITHUB_WORKSPACE/sdks-tmp"
      - name: Build
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: SecondsClock-deb
          path: packages/*.deb
          if-no-files-found: error
